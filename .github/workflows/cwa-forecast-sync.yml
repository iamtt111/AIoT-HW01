name: Synchronize CWA forecast

on:
  schedule:
    # CWA publishes F-D0047-091 at 05:30, 11:30, 17:30, and 23:30 Asia/Taipei.
    # Run five minutes later: 03:35, 09:35, 15:35, and 21:35 UTC.
    - cron: '35 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cwa-forecast-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Fetch and persist F-D0047-091
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ingestion/pyproject.toml

      - name: Install ingestion package
        run: python -m pip install --upgrade pip && python -m pip install ./ingestion

      - name: Synchronize forecast
        run: python -m cwa_weather_ingestion
