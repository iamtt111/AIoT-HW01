[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cwa-weather-ingestion"
version = "0.1.0"
description = "CWA weather forecast ingestion jobs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
cwa-weather-sync = "cwa_weather_ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
